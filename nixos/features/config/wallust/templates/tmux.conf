# Generated by wallust, do not edit.
set -g status-style "bg={{ background }},fg={{ foreground }}"
set -g status-left "#[bg={{ color2 }},fg={{ background }}] #S #[bg={{ background }},fg={{ color2 }}]"
set -g status-right "#[fg={{ color8 }}] %H:%M #[fg={{ background }},bg={{ color4 }}] #h "
set -g status-interval 5

setw -g window-status-format "#[fg={{ color8 }}] #I:#W "
setw -g window-status-current-format "#[bg={{ color2 }},fg={{ background }}] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg={{ color8 }}"
set -g pane-active-border-style "fg={{ color2 }}"
set -g message-style "bg={{ color4 }},fg={{ background }}"
